# Dedicated portable Ralph checks. This file defines future hosted evidence;
# merely committing it does not claim that hosted Windows/Linux/macOS runs passed.
name: portable-ralph
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  ralph:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install reviewed test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Shared loop, native process lifecycle, onboarding and retention
        run: >-
          python -m pytest -q
          excubitor/tests/test_runs.py
          excubitor/tests/test_supervisor.py
          excubitor/tests/test_project_backend.py
          excubitor/tests/test_approval_acceptance.py
          excubitor/tests/test_exit_code_acceptance.py
          excubitor/tests/test_literal_commands.py
          excubitor/tests/test_host_processes.py
          excubitor/tests/test_posix_processes.py
          excubitor/tests/test_processes.py
          excubitor/tests/test_watchdog.py
          excubitor/tests/test_development_adapters.py
          excubitor/tests/test_development_setup.py
          excubitor/tests/test_original_git_config.py
          excubitor/tests/test_portable_onboarding.py
          excubitor/tests/test_git_retention.py
          excubitor/tests/test_command_model.py
          excubitor/tests/test_ralph_cli.py
      - name: Build, install outside checkout, reinstall and uninstall
        run: python -m pytest -q packaging/tests/test_build.py packaging/tests/test_pyz.py
